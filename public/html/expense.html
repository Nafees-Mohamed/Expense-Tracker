<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="../css/style.css">
    
</head>

<body> 
    <div class="header-section">
        <h1>Expense Tracker</h1>
        <button class="js-logout">⏻</button>
    </div>
    
    <div class="balance-summary"></div>
    <div class="middle">
        <div class="input-container">
            <input type="number" class="js-amount" placeholder="Enter amount">
            <input type="text" class="js-description" placeholder="Description">
            <select class="js-type">
                <option>Income</option>
                <option>Expense</option>
            </select> 
            <select class="js-category">
                <option>Food</option>
                <option>Travel</option>
                <option>Housing</option>
                <option>Lifestyle</option>
            </select>
            <button type="button" class="js-add">Add Transaction</button>
        </div>  
    </div> 
    <div class="footer">
        <a href="/html/transaction.html">
            <button class="transaction-history">Transaction History</button>
        </a>

    </div>
        
    


    <script src="../js/script.js"></script>
    
</body>
</html>
