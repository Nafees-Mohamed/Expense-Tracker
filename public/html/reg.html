<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker - Register</title>
  <link rel="stylesheet" href="../css/fstyle.css">
</head>
<body id="registerPage">
  <div class="auth-container">
    <h2>Create Your Account</h2>
    <form class="regForm">
      <input type="text" class="username" placeholder="Username" required>
      <input type="email" class="email" placeholder="Email" required>
      <input type="password" class="password" placeholder="Password" required>
      <input type="password" class="confirmPassword" placeholder="Confirm Password" required>
      <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="/html/log.html">Login here</a></p>
  </div>
  <script src="../js/reg.js"></script>
</body>
</html>
